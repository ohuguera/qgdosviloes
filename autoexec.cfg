// ---- MIRA (classic static, sem ponto, ciano) ----
cl_crosshairstyle "4"
cl_crosshair_recoil "0"
cl_crosshairdot "0"
cl_crosshairsize "2"
cl_crosshairthickness "0.9"
cl_crosshairgap "-3.1"
cl_crosshair_drawoutline "0"
cl_crosshaircolor "5"
cl_crosshaircolor_r "0"
cl_crosshaircolor_g "255"
cl_crosshaircolor_b "255"
cl_crosshairusealpha "1"
cl_crosshairalpha "255"

// ---- SENSIBILIDADE (400 DPI no mouse, 1000 Hz) ----
sensitivity "2.7"
zoom_sensitivity_ratio "0.95"

// ---- VIEWMODEL ----
viewmodel_presetpos "1"
viewmodel_fov "60"
viewmodel_offset_x "1"
viewmodel_offset_y "1"
viewmodel_offset_z "-1"

echo "Kit do Vilao carregado. Entra na base: !telegram"
